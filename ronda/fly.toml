# Déploiement sur Fly.io : fly launch --no-deploy --copy-config, fly volumes create ronda_data --size 1, fly deploy
app = "ronda-dyalna"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  TURN_MS = "20000"
  BOT_FILL_MS = "12000"

[[mounts]]
  source = "ronda_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Un seul serveur, toujours allumé : les parties en cours vivent en mémoire.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 2000
    hard_limit = 5000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "3s"
